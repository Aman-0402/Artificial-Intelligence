<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Welcome — AI.learn</title>

  <link rel="stylesheet" href="../css/variables.css" />
  <link rel="stylesheet" href="../css/base.css" />
  <link rel="stylesheet" href="../css/animations.css" />
  <link rel="stylesheet" href="../css/components.css" />

  <script src="https://unpkg.com/typed.js@2.1.0/dist/typed.umd.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg-primary);
      color: var(--text-primary);
      font-family: var(--font-body);
      overflow-x: hidden;
    }

    .hero {
      position: relative;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: var(--space-12) var(--space-8);
      text-align: center;
      overflow: hidden;
    }

    #particle-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
    }

    .hero::after {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at center,
        transparent 30%,
        rgba(5, 8, 16, 0.6) 70%,
        rgba(5, 8, 16, 0.9) 100%
      );
      z-index: 1;
      pointer-events: none;
    }

    .hero__content {
      position: relative;
      z-index: 2;
      max-width: 800px;
    }

    .hero__title {
      font-family: var(--font-heading);
      font-size: clamp(2.2rem, 6vw, 4rem);
      font-weight: var(--weight-black);
      line-height: 1.1;
      letter-spacing: 0.05em;
      margin-bottom: var(--space-4);
      animation: fadeInUp 0.7s ease 0.1s both;
    }

    .hero__title-line1 {
      display: block;
      color: var(--text-primary);
    }

    .hero__title-line2 {
      display: block;
      background: linear-gradient(135deg, var(--accent-cyan), var(--accent-purple));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .hero__subtitle {
      font-family: var(--font-nav);
      font-size: clamp(1rem, 2.5vw, 1.4rem);
      color: var(--text-secondary);
      letter-spacing: 0.05em;
      margin-bottom: var(--space-8);
      min-height: 2em;
      animation: fadeInUp 0.7s ease 0.2s both;
    }

    .hero__subtitle .typed-cursor {
      color: var(--accent-cyan);
      animation: cursorBlink 0.7s step-end infinite;
    }

    .hero__cta {
      display: flex;
      gap: var(--space-4);
      justify-content: center;
      flex-wrap: wrap;
      animation: fadeInUp 0.7s ease 0.3s both;
    }

    .welcome-footer {
      position: absolute;
      bottom: var(--space-6);
      left: 50%;
      transform: translateX(-50%);
      z-index: 2;
      text-align: center;
      color: var(--text-muted);
      font-family: var(--font-nav);
      font-size: var(--text-xs);
      letter-spacing: 0.1em;
      white-space: nowrap;
    }

    @media (max-width: 600px) {
      .hero { padding: var(--space-8) var(--space-4); min-height: 100svh; }
      .hero__cta { flex-direction: column; align-items: center; }
    }
  </style>
</head>

<body>

  <section class="hero" id="hero">
    <canvas id="particle-canvas"></canvas>

    <div class="hero__content">
      <h1 class="hero__title">
        <span class="hero__title-line1">Master</span>
        <span class="hero__title-line2">Artificial Intelligence</span>
      </h1>

      <p class="hero__subtitle">
        <span id="typed-output"></span>
      </p>

      <div class="hero__cta">
        <button class="btn btn-primary btn-lg" id="cta-start">
          Start Learning &nbsp;→
        </button>
      </div>
    </div>

    <footer class="welcome-footer">
      AI.learn &nbsp;•&nbsp; HTML · CSS · JavaScript
    </footer>
  </section>

  <script src="../js/particles.js"></script>

  <script>
    ParticleManager.initCanvas('particle-canvas', {
      particleCount:   90,
      connectDistance: 140,
      particleSpeed:   0.35,
    });

    new Typed('#typed-output', {
      strings: [
        'Learn Machine Learning from scratch.',
        'Understand Neural Networks deeply.',
        'Explore NLP &amp; Transformers.',
        'Crack AI Interview Questions.',
        'Practice with MCQs &amp; Quizzes.',
      ],
      typeSpeed:    38,
      backSpeed:    18,
      backDelay:    2000,
      startDelay:   500,
      loop:         true,
      smartBackspace: true,
    });

    document.getElementById('cta-start')?.addEventListener('click', () => {
      window.parent.postMessage({ type: 'navigate', data: { id: 'what-is-ai' } }, '*');
    });

    window.addEventListener('scroll', () => {
      const el  = document.documentElement;
      const pct = (el.scrollTop / (el.scrollHeight - el.clientHeight)) * 100;
      window.parent.postMessage({ type: 'scroll-progress', data: { percent: pct || 0 } }, '*');
    }, { passive: true });
  </script>

</body>
</html>
