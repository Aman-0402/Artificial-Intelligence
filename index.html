<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="AI.learn — Futuristic Artificial Intelligence eBook Platform. Learn AI, Machine Learning, Deep Learning, NLP with interactive tutorials, MCQs, and quizzes." />
  <meta name="keywords" content="artificial intelligence, machine learning, deep learning, NLP, AI tutorials, MCQ, quiz" />
  <title>AI.learn — Artificial Intelligence eBook Platform</title>

  <!-- Favicon (inline SVG) -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🤖</text></svg>" />

  <!-- CSS Design System -->
  <link rel="stylesheet" href="css/variables.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/animations.css" />
  <link rel="stylesheet" href="css/header.css" />
  <link rel="stylesheet" href="css/sidebar.css" />
  <link rel="stylesheet" href="css/content.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/theme-light.css" />
</head>

<body>

  <!-- ================================================
       HEADER
  ================================================ -->
  <header class="header" id="header" role="banner">

    <!-- Hamburger / Sidebar Toggle -->
    <button
      class="header__hamburger"
      id="hamburger"
      aria-label="Toggle sidebar navigation"
      aria-expanded="false"
      aria-controls="sidebar"
    >
      <span class="bar"></span>
      <span class="bar"></span>
      <span class="bar"></span>
    </button>

    <!-- Logo -->
    <a href="#" class="header__logo" id="logo-home" aria-label="AI.learn home">
      <span class="header__logo-text">AI<span>.</span>learn</span>
    </a>

    <!-- Spacer -->
    <div class="header__spacer"></div>

    <!-- Right Controls -->
    <div class="header__controls" role="toolbar" aria-label="Header controls">

      <!-- Search -->
      <button
        class="header__btn header__btn--search"
        id="search-toggle"
        aria-label="Open search"
        title="Search topics"
      >
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"></circle>
          <path d="M21 21l-4.35-4.35"></path>
        </svg>
      </button>

      <!-- TTS Toggle -->
      <button
        class="header__btn header__btn--tts"
        id="tts-toggle"
        aria-label="Toggle text to speech"
        title="Read aloud"
      >
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
          <path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path>
          <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
        </svg>
      </button>

      <!-- Fullscreen -->
      <button
        class="header__btn header__btn--fullscreen"
        id="fullscreen-toggle"
        aria-label="Toggle fullscreen reading"
        title="Fullscreen reading mode"
      >
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"></path>
        </svg>
      </button>

      <!-- Theme Toggle -->
      <button
        class="header__btn header__btn--theme"
        id="theme-toggle"
        aria-label="Toggle light/dark theme"
        title="Toggle theme"
      >
        <!-- Moon icon (shown in dark mode — click to go light) -->
        <svg class="icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
        </svg>
        <!-- Sun icon (shown in light mode — click to go dark) -->
        <svg class="icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none">
          <circle cx="12" cy="12" r="5"></circle>
          <line x1="12" y1="1" x2="12" y2="3"></line>
          <line x1="12" y1="21" x2="12" y2="23"></line>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
          <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
          <line x1="1" y1="12" x2="3" y2="12"></line>
          <line x1="21" y1="12" x2="23" y2="12"></line>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
          <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
        </svg>
      </button>

    </div>

    <!-- Reading Progress Bar -->
    <div class="progress-bar" id="progress-bar" role="progressbar" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100"></div>

  </header>

  <!-- ================================================
       SEARCH OVERLAY
  ================================================ -->
  <div class="search-overlay" id="search-overlay" role="search" aria-hidden="true">
    <input
      type="text"
      class="search-overlay__input"
      id="search-input"
      placeholder="Search topics... (e.g. Neural Networks, Supervised Learning)"
      autocomplete="off"
      aria-label="Search topics"
    />
  </div>

  <!-- ================================================
       MOBILE SIDEBAR OVERLAY
  ================================================ -->
  <div class="sidebar-overlay" id="sidebar-overlay" aria-hidden="true"></div>

  <!-- ================================================
       APP LAYOUT
  ================================================ -->
  <div class="app-layout">

    <!-- SIDEBAR -->
    <aside class="sidebar" id="sidebar" role="navigation" aria-label="Topics navigation">

      <!-- Mobile Header inside Sidebar -->
      <div class="sidebar__header">
        <span class="header__logo-text" style="font-size: 1.1rem;">AI<span>.</span>learn</span>
        <button class="sidebar__close" id="sidebar-close" aria-label="Close sidebar">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>

      <!-- Sidebar Search -->
      <div class="sidebar__search">
        <input
          type="text"
          class="sidebar__search-input"
          id="sidebar-search"
          placeholder="🔍 Search topics..."
          autocomplete="off"
          aria-label="Filter topics"
        />
      </div>

      <!-- Nav Tree (dynamically generated by sidebar.js) -->
      <nav class="sidebar__nav" id="sidebar-nav" aria-label="Topic list">
        <!-- JS renders topic groups here -->
        <div class="sidebar__section-label">Topics</div>
        <div id="nav-tree"></div>
      </nav>

      <!-- Sidebar Footer -->
      <div class="sidebar__footer">
        <p class="sidebar__footer-text">AI.learn v1.0 &nbsp;|&nbsp; Static Platform</p>
      </div>

    </aside>

    <!-- MAIN CONTENT -->
    <main class="main-content" id="main-content" role="main">

      <!-- iframe Wrapper -->
      <div class="content-frame-wrapper">

        <!-- Loading Overlay -->
        <div class="frame-loader" id="frame-loader" aria-live="polite" aria-label="Loading content">
          <div class="frame-loader__spinner"></div>
          <span class="frame-loader__text">Loading...</span>
        </div>

        <!-- Content iframe -->
        <iframe
          id="content-frame"
          src="topics/welcome.html"
          title="Topic content"
          allow="autoplay"
          loading="eager"
        ></iframe>

      </div>

    </main>

  </div>

  <!-- ================================================
       DATA & JS MODULES
       Load order matters:
       1. Data (topics tree)
       2. Core modules
       3. App init (last)
  ================================================ -->
  <script src="data/topics.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/sidebar.js"></script>
  <script src="js/navigation.js"></script>
  <script src="js/tts.js"></script>
  <script src="js/particles.js"></script>
  <script src="js/app.js"></script>

</body>
</html>
